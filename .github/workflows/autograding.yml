name: Autograding

on:
  push:
    branches-ignore:
      - badges
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autograding-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grade:
    name: Grade / 10 points
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      score: ${{ steps.tests.outputs.score }}
      total: ${{ steps.tests.outputs.total }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compile and grade
        id: tests
        continue-on-error: true
        run: python3 tests/grade.py --report-dir .grading
      - name: Save grading report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grading-report
          path: |
            .grading/results.json
            .grading/summary.md
            .grading/points.svg
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Mark incomplete or incorrect solution as failed
        if: always() && steps.tests.outcome != 'success'
        run: exit 1

  points-badge:
    name: Update Points badge
    needs: grade
    if: >-
      always() && !cancelled() && github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.grade.outputs.score != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: write
    steps:
      # This job never checks out or runs the student's code/artifacts.
      - name: Publish score on the badges branch
        uses: actions/github-script@v9
        env:
          GRADE_SCORE: ${{ needs.grade.outputs.score }}
          GRADE_TOTAL: ${{ needs.grade.outputs.total }}
        with:
          script: |
            const rawScore = process.env.GRADE_SCORE;
            const rawTotal = process.env.GRADE_TOTAL;
            if (!/^(?:[0-9]|10)$/.test(rawScore || '') || rawTotal !== '10') {
              core.warning('No valid score was produced; the previous badge is unchanged.');
              return;
            }
            const score = Number(rawScore);
            const repo = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const latest = await github.rest.git.getRef({
              ...repo, ref: `heads/${defaultBranch}`
            });
            if (latest.data.object.sha !== context.sha) {
              core.info('A newer submission exists; this run will not replace its badge.');
              return;
            }

            let parent = null;
            let baseTree = null;
            try {
              const branch = await github.rest.git.getRef({...repo, ref: 'heads/badges'});
              parent = branch.data.object.sha;
              const commit = await github.rest.git.getCommit({...repo, commit_sha: parent});
              baseTree = commit.data.tree.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const color = score === 10 ? '#238636' : score > 0 ? '#b08800' : '#c43c35';
            const label = `${score}/10`;
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="126" height="24" role="img" aria-label="Points: ${label}"><title>Points: ${label}</title><rect width="126" height="24" rx="4" fill="#38424f"/><path d="M66 0h56a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H66z" fill="${color}"/><g fill="#fff" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle"><text x="33" y="16">Points</text><text x="96" y="16">${label}</text></g></svg>\n`;
            const metadata = JSON.stringify({
              score, total: 10, commit: context.sha,
              run_url: `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`
            }, null, 2) + '\n';
            const treeArgs = {
              ...repo,
              tree: [
                {path: '.github/badges/points.svg', mode: '100644', type: 'blob', content: svg},
                {path: '.github/badges/run.json', mode: '100644', type: 'blob', content: metadata}
              ]
            };
            if (baseTree) treeArgs.base_tree = baseTree;
            const tree = await github.rest.git.createTree(treeArgs);
            const commit = await github.rest.git.createCommit({
              ...repo, message: `Autograding: ${label} for ${context.sha.slice(0, 12)}`,
              tree: tree.data.sha, parents: parent ? [parent] : []
            });
            if (parent) {
              await github.rest.git.updateRef({
                ...repo, ref: 'heads/badges', sha: commit.data.sha, force: false
              });
            } else {
              await github.rest.git.createRef({
                ...repo, ref: 'refs/heads/badges', sha: commit.data.sha
              });
            }
            core.info(`Points badge updated to ${label}. See the grading report for details.`);
